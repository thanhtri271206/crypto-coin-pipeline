name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -sL --connect-timeout 30 --max-time 60 -o /dev/null -w "%{http_code}\n" https://crypto-coin-pipeline.streamlit.app/
