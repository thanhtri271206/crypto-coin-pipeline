name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          HTTP_STATUS=$(curl -sSL -A "Mozilla/5.0" \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --cookie-jar /tmp/cookies.txt \
            --cookie /tmp/cookies.txt \
            -o /dev/null \
            -w "%{http_code}" \
            https://crypto-coin-pipeline.streamlit.app/)

          echo "Streamlit HTTP response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Ping successful! Streamlit app is alive."
          else
            echo "Ping failed with status $HTTP_STATUS"
            exit 1
          fi
